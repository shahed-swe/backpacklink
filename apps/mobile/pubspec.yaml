name: backpacklink
description: BackpackLink — travel eSIM data plans for 200+ countries.
publish_to: "none"
version: 1.0.0+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  socket_io_client: ^2.0.3+1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#22A7EE"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
