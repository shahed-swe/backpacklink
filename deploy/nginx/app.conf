# BackpackLink reverse proxy — TLS terminates here, proxies to the containers.
# One SAN cert covers apex + www + api + admin.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP: serve ACME challenge, redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name backpacklink.com www.backpacklink.com api.backpacklink.com admin.backpacklink.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Website (apex + www) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backpacklink.com www.backpacklink.com;

    ssl_certificate     /etc/letsencrypt/live/backpacklink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backpacklink.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---- API (REST + socket.io websockets) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.backpacklink.com;

    ssl_certificate     /etc/letsencrypt/live/backpacklink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backpacklink.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# ---- Admin panel ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.backpacklink.com;

    ssl_certificate     /etc/letsencrypt/live/backpacklink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backpacklink.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://admin:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
