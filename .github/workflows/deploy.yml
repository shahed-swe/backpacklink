name: Deploy (self-hosted)

# Auto-deploys web + admin + api to the server on every push to master.
# Runs on a self-hosted GitHub Actions runner installed on the server itself.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide server .env
        # Secrets live only on the server (never in the repo / GitHub).
        run: cp "$HOME/backpacklink.env" .env

      - name: Build & (re)start containers
        run: |
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health >/dev/null; then
              echo "✅ API healthy"; exit 0
            fi
            sleep 2
          done
          echo "❌ API did not become healthy"; docker compose logs --tail=50 api; exit 1
