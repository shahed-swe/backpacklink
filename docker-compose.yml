# Runs the BackpackLink backend + customer website + admin panel together.
#   docker compose up --build
# Backend:  http://localhost:4000
# Website:  http://localhost:3000
# Admin:    http://localhost:3001   (login with ADMIN_EMAIL / ADMIN_PASSWORD)
#
# Secrets (ESIMCARD_TOKEN, JWT_SECRET, Stripe keys, markup, etc.) are read from
# the root .env via env_file — they are NOT baked into the images.

services:
  api:
    build:
      context: ./apps/api
    container_name: bpl-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # SQLite lives on a named volume (kept out of the image / schema dir).
      DATABASE_URL: "file:/data/dev.db"
      # Seeds an admin user on first boot (change these!).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@backpacklink.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    ports:
      - "127.0.0.1:4000:4000" # localhost only; public access is via nginx
    volumes:
      - bpl-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        # Browser-side calls (auth, checkout, socket) use the host-published API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: bpl-web
    environment:
      NODE_ENV: production
      # Server-side rendering reaches the API over the docker network.
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      args:
        # The admin runs in the browser, so it must reach the API at the
        # host-published URL (not the docker-internal hostname).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: bpl-admin
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    restart: unless-stopped

  # NOTE: TLS/HTTPS is handled by the HOST nginx (this server already runs one
  # for other sites), reverse-proxying to the 127.0.0.1 ports above.
  # See deploy/host-nginx/ for the host config. No nginx/certbot container here.

volumes:
  bpl-data:
