# Runs the BackpackLink backend + customer website + admin panel together.
#   docker compose up --build
# Backend:  http://localhost:4000
# Website:  http://localhost:3000
# Admin:    http://localhost:3001   (login with ADMIN_EMAIL / ADMIN_PASSWORD)
#
# Secrets (ESIMCARD_TOKEN, JWT_SECRET, Stripe keys, markup, etc.) are read from
# the root .env via env_file — they are NOT baked into the images.

services:
  api:
    build:
      context: ./apps/api
    container_name: bpl-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # SQLite lives on a named volume (kept out of the image / schema dir).
      DATABASE_URL: "file:/data/dev.db"
      # Seeds an admin user on first boot (change these!).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@backpacklink.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    ports:
      - "127.0.0.1:4000:4000" # localhost only; public access is via nginx
    volumes:
      - bpl-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        # Browser-side calls (auth, checkout, socket) use the host-published API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: bpl-web
    environment:
      NODE_ENV: production
      # Server-side rendering reaches the API over the docker network.
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      args:
        # The admin runs in the browser, so it must reach the API at the
        # host-published URL (not the docker-internal hostname).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: bpl-admin
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: bpl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload every 6h so renewed certs are picked up automatically.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"]
    depends_on:
      - web
      - api
      - admin
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: bpl-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew loop (initial issuance is done by deploy/init-letsencrypt.sh).
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

volumes:
  bpl-data:
  certbot-conf:
  certbot-www:
